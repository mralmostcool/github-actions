name: 05 - Build & Deploy Documentation

on:
  push:
    branches: [ main, master ]
    paths:
      - 'docs/**'
      - '.github/workflows/05-publish-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile Markdown Notes to HTML
        run: |
          mkdir -p _site
          # Install a lightweight markdown-to-html converter
          npm install -g marked
          
          # Render index.html
          echo '<!DOCTYPE html><html><head><meta charset="utf-8"><title>Dev Docs</title><style>body{font-family:system-ui,sans-serif;max-width:800px;margin:40px auto;padding:0 20px;line-height:1.6;color:#222;} pre,code{background:#f4f4f4;padding:2px 6px;border-radius:4px;}</style></head><body>' > _site/index.html
          marked docs/index.md >> _site/index.html
          echo '<hr>' >> _site/index.html
          marked docs/architecture.md >> _site/index.html
          echo '</body></html>' >> _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4