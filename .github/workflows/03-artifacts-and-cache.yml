name: 03 - Checkout, Build, and Artifacts

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify checked-out files
        run: |
          echo "Workspace directory contents:"
          ls -la

      - name: Simulate compiling a project & generating docs
        run: |
          mkdir -p dist
          echo "Build artifact compiled on $(date)" > dist/app-bundle.txt
          echo "# Project Documentation" > dist/README.md

      - name: Upload build output as an artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-files
          path: dist/
          retention-days: 1

  consume-and-verify:
    needs: [ build-and-package ]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact from previous jobs
        uses: actions/download-artifact@v4
        with:
          name: app-release-files
          path: downloaded-dist
          
      - name: Inspect downloaded files
        run: |
          echo "Content of downloaded-dist:"
          ls -la downloaded-dist
          cat downloaded-dist/app-bundle.txt